<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio ~ Steven Wright</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header></header>
    <!-- So we're gonna divide the main window into 4 sections -->
    <div id="main-window-full">
        <!-- Top -->
        <div id='main-window-top'>
            <div class='main-window-header'>
                <h1>Portfolio</h1>
                <div id='button-background3'>
                    <div class='button-all' id='minimize-button'></div>
                </div>
                <div id='button-background2'>
                    <div class='button-all' id='maximize-button'></div>

                <div id='button-background'>
                    <div class='button-all' id='x-button'></div>
                </div>
            </div>
        </div>
        <!-- Sides -->
        <div class="main-window-sides">
            <div class='main-window-right-left' id='main-window-left'></div>
            <div class='main-window-right-left' id='main-window-right'></div>

        <!-- Bottom -->
        <div id="main-window-bottom"></div>
        <!-- Main Content -->
        <main id="Projects-container">
            <a class="space" href="weatherAppPage.html">
                <button>
                    <div class="thumbnail-container">

                </button>
                <img class='sticker' src="public/React-icon4.png" alt="Built with React">

            <a class="space" href="healthCareDashboardPage.html">
                <button>
                    <div class="thumbnail-container">
                        <img class='thumbnails' src="public/healthCareDashboard.png" alt="Health Care Dashboard thumbnail">

                    </div>
                </button>
                <img class='sticker' src="public/React-icon4.png" alt="Built with React">
            </a>

            <a class="space" href="digitalBlackboardPage.html">
                <button>
                    <div class="thumbnail-container">
                        <img class='thumbnails' src="public/digitalBlackboard.png" alt="Digital Blackboard thumbnail">
                        <span id='proj-name'>Digital Blackboard</span>
                    </div>
                </button>
            </a>

            <a class="space" href="ToDoList_Page.html">
                <button>
                    <div class="thumbnail-container">
                        <img class='thumbnails' src="public/todoListImage.png" alt="To-Do List thumbnail">
                        <span id='proj-name'>To-Do List</span>
                    </div>
                </button>
            </a>
        </main>
    </div>
    <footer id="footer">Copyright © 2026 Steven Wright
        <a id='footer-hyperlink' target="_blank" href="https://github.com/StevenWright99">
            <button>Github.com/StevenWright99</button>
        </a>
